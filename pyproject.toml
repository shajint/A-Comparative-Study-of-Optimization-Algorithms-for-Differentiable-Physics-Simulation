[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fully-differentiable-simulation"
version = "0.1.0"
description = "Fully-differentiable JAX FEM for magnetic component inverse design with a benchmark of optimization algorithms"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools]
packages = ["new_fem_engine", "optimizers", "cores"]
